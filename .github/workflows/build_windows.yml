name: Build Hilton High School Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF Pillow openpyxl python-docx pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Hilton High School" `
            --hidden-import hilton_ui `
            report_splitter_1788075570331.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Hilton-High-School-Windows
          path: dist/Hilton High School.exe