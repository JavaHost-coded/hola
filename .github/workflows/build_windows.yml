name: Build Hilton High School Windows App

"on": workflow_dispatch

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF Pillow openpyxl python-docx pyinstaller

      - name: Find application files
        id: files
        shell: pwsh
        run: |
          $appCandidates = @(
            "report_splitter_1788075570331.py",
            "assets\report_splitter_1788075570331.py",
            "attached_assets\report_splitter_1788075570331.py"
          )

          $uiCandidates = @(
            "hilton_ui.py",
            "assets\hilton_ui.py",
            "attached_assets\hilton_ui.py"
          )

          $app = $appCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          $ui = $uiCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $app) {
            Write-Host "Repository contents:"
            Get-ChildItem -Path . -Recurse -File |
              Select-Object FullName
            throw "report_splitter_1788075570331.py was not found."
          }

          if (-not $ui) {
            throw "hilton_ui.py was not found."
          }

          $uiFolder = Split-Path -Parent $ui

          if (-not $uiFolder) {
            $uiFolder = "."
          }

          "app=$app" >> $env:GITHUB_OUTPUT
          "ui_folder=$uiFolder" >> $env:GITHUB_OUTPUT

          Write-Host "Using application: $app"
          Write-Host "Using UI module folder: $uiFolder"

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Hilton High School" `
            --paths "${{ steps.files.outputs.ui_folder }}" `
            --hidden-import hilton_ui `
            "${{ steps.files.outputs.app }}"

          if (-not (Test-Path "dist\Hilton High School.exe")) {
            Write-Host "Build output:"
            Get-ChildItem -Path . -Recurse -File |
              Select-Object FullName
            throw "PyInstaller did not create the executable."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Hilton-High-School-Windows
          path: "dist/Hilton High School.exe"
